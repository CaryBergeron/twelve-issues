<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Twelve Issues</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,550;12..96,650;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="/"><span class="brand-mark">12</span>Twelve Issues</a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="auth"><div class="auth-card">
  <h1>Choose a new password</h1>
  <div id="msg" hidden></div>
  <form id="f" novalidate>
    <div class="field"><label for="password">New password <span class="hint">At least 8 characters</span></label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn" type="submit">Save new password</button>
  </form>
</div></main>
<script src="/assets/app.js"></script>
<script>
TI.renderNav(null);
const token = new URLSearchParams(location.search).get('token') || '';
TI.$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true;
  try {
    await TI.api('auth/reset', { method: 'POST', body: { token, password: TI.$('#password').value } });
    TI.showOk(TI.$('#msg'), 'Password saved. Taking you to log in.');
    setTimeout(() => (location.href = '/login.html'), 1200);
  } catch (err) { TI.showError(TI.$('#msg'), err.message); btn.disabled = false; }
});
</script>
</body>
</html>
