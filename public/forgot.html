<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password | Twelve Issues</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="/"><img src="/assets/logo.svg" alt="Twelve Issues" width="196" height="27"></a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="auth"><div class="auth-card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email and we will send you a link to choose a new password.</p>
  <div id="msg" hidden></div>
  <form id="f" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <button class="btn" type="submit">Send reset link</button>
  </form>
  <p class="auth-alt"><a href="/login.html">Back to log in</a></p>
</div></main>
<script src="/assets/app.js"></script>
<script>
TI.renderNav(null);
TI.$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true;
  try {
    const r = await TI.api('auth/forgot', { method: 'POST', body: { email: TI.$('#email').value } });
    TI.showOk(TI.$('#msg'), r.email_enabled
      ? 'If that email has an account, a reset link is on its way. Check your inbox.'
      : 'Email us at hello@twelveissues.com from the address on your account and we will reset it for you.');
  } catch (err) { TI.showError(TI.$('#msg'), err.message); }
  btn.disabled = false;
});
</script>
</body>
</html>
