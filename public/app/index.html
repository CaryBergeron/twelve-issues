<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your projects | Twelve Issues</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,550;12..96,650;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="/"><span class="brand-mark">12</span>Twelve Issues</a>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="page"><div class="wrap">
  <div class="page-head">
    <div><h1>Your projects</h1><p class="muted" id="hello" style="margin:.4rem 0 0"></p></div>
    <a class="btn" href="/app/new.html">Start a new project</a>
  </div>
  <div id="msg" hidden></div>
  <div id="list"><p class="muted">Loading your projects...</p></div>
</div></main>
<script src="/assets/app.js"></script>
<script>
(async () => {
  const user = await TI.requireLogin();
  TI.$('#hello').textContent = user.name ? `Signed in as ${user.name}` : `Signed in as ${user.email}`;
  try {
    const { submissions } = await TI.api('submissions');
    if (!submissions.length) {
      TI.$('#list').innerHTML = `<div class="empty"><h2>Your first year of newsletters starts here</h2>
        <p class="muted">Upload a book or your business content, or answer a few questions. You will have 12 issues in about 10 minutes.</p>
        <a class="btn btn-lg" href="/app/new.html">Start a project</a></div>`;
      return;
    }
    TI.$('#list').innerHTML = '<div class="list">' + submissions.map(s => `
      <a class="item" href="/app/submission.html?id=${s.id}">
        <span><span class="item-title">${TI.esc(s.title)}</span><br><span class="small muted">${s.kind === 'author' ? 'Book' : 'Business'} &nbsp; ${s.issue_count}/12 issues</span></span>
        <span class="small muted item-date">${TI.date(s.created_at)}</span>
        <span class="pill pill-${s.status}">${TI.STATUS[s.status] || s.status}</span>
      </a>`).join('') + '</div>';
  } catch (err) { TI.showError(TI.$('#msg'), err.message); TI.$('#list').innerHTML = ''; }
})();
</script>
</body>
</html>
